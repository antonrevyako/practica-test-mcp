services:
  practica:
    image: practica-test-mcp:local
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      TUNNEL_ENABLED: "${TUNNEL_ENABLED:-true}"
      PERSIST_SESSION: "${PERSIST_SESSION:-true}"
      TUNNEL_SERVICE_URL: http://tunnel:4300
    volumes:
      - practica-data:/app/data
    depends_on:
      tunnel:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
  tunnel:
    image: practica-test-mcp-tunnel:local
    build:
      context: .
      target: tunnel-runtime
    environment:
      PORT: ${PORT:-3000}
      TUNNEL_ENABLED: "${TUNNEL_ENABLED:-true}"
    volumes:
      - practica-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  practica-data:
